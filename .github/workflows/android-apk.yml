name: Validate TUNIBIZ Android source
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tunibiz-android-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: false
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Permanent release signing remains local. No debug APK publication.
