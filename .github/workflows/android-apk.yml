name: Build TUNIBIZ Android APK
on:
  workflow_dispatch:
  push:
    tags:
      - build-pilot-0.4.0
permissions:
  contents: write
concurrency:
  group: tunibiz-android-test
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: false
      - name: Fetch dependencies
        run: flutter pub get
      - name: Prepare Android wrapper
        run: chmod +x android/gradlew
      - name: Unit and widget tests
        run: flutter test
      - name: Build pilot APK (ARM64, cloud HTTPS)
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=API_BASE=https://ihebhaouech.pythonanywhere.com
      - name: Stage and verify package
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/TUNIBIZ-v0.4.0-pilot.apk
          unzip -tq artifacts/TUNIBIZ-v0.4.0-pilot.apk
          sha256sum artifacts/TUNIBIZ-v0.4.0-pilot.apk > artifacts/SHA256SUMS.txt
      - name: Publish pilot test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.4.0-pilot" artifacts/TUNIBIZ-v0.4.0-pilot.apk artifacts/SHA256SUMS.txt --target "$GITHUB_SHA" --title "TUNIBIZ Android 0.4.0 Cloud pilot" --notes "Debug-signed pilot APK. Uses HTTPS cloud API, not a production-signed Play Store build. Google and email integrations require server configuration." --prerelease
